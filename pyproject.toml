[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-secure-rag"
version = "0.1.0"
description = "Secure multi-tenant RAG: per-document ACLs, permission-filtered retrieval (filter-before-rank), verified citations, full audit log — extractive answers, no LLM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
retrieval = ["scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
